name: axit-phase0

services:
  postgres:
    image: postgres:17.6-alpine3.22
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-axit}
      POSTGRES_USER: ${POSTGRES_USER:-axit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axit-phase0-only}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  # Schema upgrades are an explicit, one-shot dependency.  Neither the API
  # health endpoint nor the worker performs DDL as a side effect of startup.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.migrations", "upgrade"]
    init: true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axit}:${POSTGRES_PASSWORD:-axit-phase0-only}@postgres:5432/${POSTGRES_DB:-axit}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    init: true
    # 승인된 설명 구체화와 전체 보고서 파이프라인용 xAI 키. 승인 범위는
    # docs/provider-experiment-description-assist-amendment.md 및
    # docs/provider-experiment-full-report-pipeline-amendment.md 참고.
    # .env.grok.local이 없으면 설명 구체화는 503, 보고서 생성은 fail-closed 처리됩니다.
    env_file:
      - path: .env.grok.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axit}:${POSTGRES_PASSWORD:-axit-phase0-only}@postgres:5432/${POSTGRES_DB:-axit}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost:3000}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AXIT_BLOB_ROOT: /var/lib/axit/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # Starlette spools multipart files above 1 MiB into /tmp. Keep enough
      # bounded scratch space for one accepted 200 MiB file plus envelope and
      # parser overhead without making the API filesystem writable.
      - /tmp:size=256m,mode=1777
    volumes:
      - ${AXIT_BLOB_ROOT:-./.axit-blobs}:/var/lib/axit/blobs

  orchestrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.orchestrator"]
    init: true
    # 승인된 요약·외부검증·RAG 최종문서·추천 파이프라인 전용 키입니다.
    # 키가 없거나 Grok 호출이 실패하면 Mock/offline 결과로 대체하지 않고
    # 해당 작업을 재시도 가능한 실패로 기록합니다.
    env_file:
      - path: .env.grok.local
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-axit}:${POSTGRES_PASSWORD:-axit-phase0-only}@postgres:5432/${POSTGRES_DB:-axit}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.orchestrator", "--healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build:
      context: .
      dockerfile: AXit_project-main_goal_frontend/Dockerfile
    init: true
    environment:
      INTERNAL_API_URL: http://api:8000
      # 기본값(30초)은 "설명 구체화" 인터뷰처럼 AI가 명확도를 채점하며
      # 답하는 느린 라운드에는 빠듯합니다. 1분으로 여유를 둡니다.
      INTERNAL_API_TIMEOUT_MS: "60000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:3000:3000"
