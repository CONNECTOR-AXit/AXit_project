[project]
name = "axit-meeting-rag"
version = "0.1.0"
description = "Provenance-first meeting pre-briefing RAG platform"
requires-python = "==3.12.*"
dependencies = [
  "fastapi==0.139.2",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "e2e: browser end-to-end tests",
  "evaluation: deterministic quality evaluation tests",
  "integration: tests that require service processes",
  "phase0: disposable Option A transport proof",
  "security: security boundary tests",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps/api"]
exclude = ["^apps/api/tests/"]
